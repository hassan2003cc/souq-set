<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>سوق الحي</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      direction: rtl;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #4CAF50;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 24px;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .prompt {
      font-size: 18px;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      height: 100px;
      font-size: 16px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      resize: none;
    }

    button {
      margin-top: 15px;
      background-color: #4CAF50;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .thank-you {
      margin-top: 20px;
      color: #4CAF50;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    أهلاً بالزائرين الكرام
  </header>

  <div class="container">
    <div class="prompt">ما هي حاجتك من السوق؟</div>
    <textarea id="userRequest" placeholder="اكتب حاجتك هنا..."></textarea>
    <button onclick="sendRequest()">إرسال الطلب</button>
    <div class="thank-you" id="thankYouMsg">تم استلام طلبك! سيتم التواصل معك قريبًا.</div>
  </div>

  <script>
    function sendRequest() {
      const text = document.getElementById('userRequest').value;
      if (text.trim() !== "") {
        // في المستقبل: أرسل الطلب إلى خادم أو بريد إلكتروني
        console.log("طلب المستخدم:", text);
        document.getElementById('thankYouMsg').style.display = 'block';
        document.getElementById('userRequest').value = "";
      }
    }
  </script>

</body>
</html>
